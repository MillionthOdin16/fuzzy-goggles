name: Build CH32V Firmware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-
          
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        
    - name: Install CH32V platform
      run: pio pkg install -g --platform https://github.com/Community-PIO-CH32V/platform-ch32v.git
      
    - name: Install dependencies
      run: pio lib install
      
    - name: Build firmware
      run: pio run -e ch32v203f8p6
      
    - name: Build debug firmware
      run: pio run -e debug
      
    - name: Run static analysis
      run: pio check -e ch32v203f8p6 --fail-on-defect=high
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: firmware-${{ github.sha }}
        path: |
          .pio/build/ch32v203f8p6/firmware.elf
          .pio/build/ch32v203f8p6/firmware.bin
        retention-days: 30
        
  format-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format
      
    - name: Check code formatting
      run: |
        find src/ -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run --Werror --style=file
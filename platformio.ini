[env:ch32v203f8p6]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = ch32v203f8p6-r0-1v1
framework = arduino

; Build configuration
build_flags = 
    -DCHIP_CH32V203F8P6
    -DARDUINO_ARCH_CH32
    -Os
    -Wall
    -Wextra

; Serial monitor configuration
monitor_speed = 115200
monitor_port = auto

; Upload configuration
upload_protocol = wch-link
debug_tool = wch-link

; Library dependencies
lib_deps = 
    adafruit/Adafruit NeoPixel@^1.10.0

; Source directories
src_dir = src
include_dir = src

; Build environment
build_type = release
check_tool = cppcheck
check_flags = 
    --enable=all
    --inconclusive
    --std=c++11

[env:debug]
extends = env:ch32v203f8p6
build_type = debug
build_flags = 
    ${env:ch32v203f8p6.build_flags}
    -DDEBUG
    -g
    -O0

[env:test]
platform = native
framework = 
build_flags = 
    -DUNIT_TEST
    -std=gnu++11
    -Wall
    -Wextra
lib_deps = 
    googletest
test_framework = googletest
test_build_project_src = false